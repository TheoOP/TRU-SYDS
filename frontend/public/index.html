<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0A0A0A" />
        <meta
            name="description"
            content="TRU SYDS is an African theatre arts organization uplifting African and African American stories through powerful stage and screen performance."
        />

        <!-- Link previews (iMessage, WhatsApp, Slack, Facebook, X). Without these,
             scrapers fall back to <title> and the description above. -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="TRU SYDS" />
        <meta property="og:title" content="TRU SYDS — African Theatre Arts" />
        <meta
            property="og:description"
            content="Empowering Voices. Celebrating Culture. Inspiring Change."
        />
        <meta property="og:url" content="https://theoop.github.io/TRU-SYDS/" />
        <!-- og:image must be an absolute URL — social scrapers do not resolve relative paths. -->
        <meta property="og:image" content="https://theoop.github.io/TRU-SYDS/og-image.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="TRU SYDS LLC — comedy and tragedy theatre masks rendered as film strips in green and gold"
        />
        <meta name="twitter:image" content="https://theoop.github.io/TRU-SYDS/og-image.png" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="TRU SYDS — African Theatre Arts" />
        <meta
            name="twitter:description"
            content="Empowering Voices. Celebrating Culture. Inspiring Change."
        />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />

        <!-- Small sizes use the mask mark only; the "TRU SYDS LLC" wordmark is
             illegible below ~48px. %PUBLIC_URL% resolves to "." (homepage: "."),
             which keeps these working under the /TRU-SYDS/ sub-path. -->
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
        <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
        <link rel="manifest" href="%PUBLIC_URL%/site.webmanifest" />

        <title>TRU SYDS — African Theatre Arts</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
